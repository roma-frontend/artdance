name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: экономия минут раннера
# и отсутствие гонок между двумя деплоями одной ветки.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Значения-заглушки: сборке нужен валидный env, но не нужны реальные секреты.
  # Схема в src/config/env.ts падает на неполном окружении — это и проверяется.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: local
  NEXT_PUBLIC_DEFAULT_LOCALE: hy
  NEXT_PUBLIC_FEATURE_SHOP: 'true'
  NEXT_PUBLIC_FEATURE_COURSES: 'false'
  NEXT_PUBLIC_FEATURE_EVENTS: 'true'
  NEXT_PUBLIC_FEATURE_SUBSCRIPTIONS: 'true'
  NEXT_PUBLIC_FEATURE_VIDEO: 'false'
  NEXT_PUBLIC_MEDIA_CDN_URL: https://pub-3a0600ebdb9946a09619fd872274be49.r2.dev
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artdance
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artdance
  AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
  PAYMENT_PROVIDER: mock
  SMS_PROVIDER: mock
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Быстрые проверки консистентности. Идут отдельным job'ом, чтобы падать за
  # полминуты, а не после четырёхминутной сборки.
  consistency:
    name: Токены и переводы
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate
      # tokens.css — производный артефакт. Если его забыли пересобрать,
      # CSS в репозитории расходится с TypeScript-токенами.
      - name: Токены соответствуют CSS
        run: npm run tokens:check
      # Обращение к необъявленной CSS-переменной не даёт ни ошибки сборки, ни
      # предупреждения: правило просто игнорируется. Один такой случай уже стоил
      # editorial-секции вертикальных отступов, и заметили его глазами.
      - name: Каждая CSS-переменная объявлена
        run: npm run css:check
      # Паритет локалей: недостающий ключ, пустой перевод или потерянный
      # ICU-плейсхолдер ломают сборку, а не всплывают у пользователя.
      - name: Паритет локалей hy/ru/en
        run: npm run i18n:check
      # Медиа: непережатый PNG на мегабайт не должен попасть в репозиторий,
      # а сгенерированный манифест размеров — разойтись с файлами на диске.
      - name: Медиа оптимизировано и в бюджете
        run: npm run media:check
      # Файлы петель: наличие всех версий кадра, отсутствие дублей по паре
      # «ширина + формат» и бюджет на файл. Проверка добавлена после случая, когда
      # файлы узких версий исчезли с диска, а манифест продолжал на них ссылаться:
      # страница отдавала браузеру ссылку в пустоту, и поймали это только e2e.
      - name: Петли на месте и в бюджете
        run: npm run video:check
      # Классы прототипа, не закреплённые ни за одним компонентом, — это части
      # утверждённого макета, которые могут потеряться при вёрстке.
      - name: Классы макета закреплены за компонентами
        run: npm run design:check

  quality:
    name: Типы, линтер, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  schema:
    name: Схема БД
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artdance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artdance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma validate
      - name: Миграции соответствуют схеме
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Парные брони и конкурентное списание пакетов
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artdance_ci
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artdance_ci
          BOOKING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artdance_ci
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres artdance_ci
          npx prisma generate
          npx prisma migrate deploy
          node --conditions=react-server --import tsx scripts/verify-booking-db.ts

  # Vercel деплоит каждый пуш в main параллельно с этим workflow.
  # Его статус виден в GitHub Deployments, не в этом файле.
  build:
    name: Сборка, бюджет бандла, заголовки
    runs-on: ubuntu-latest
    # Сборка перестала быть только сборкой: вместе со страницами
    # прерисовываются карточки ссылок для соцсетей — около сотни картинок
    # 1200×630, каждая с пережатием кадра через sharp. Это минуты, а не секунды.
    timeout-minutes: 30
    needs: [consistency]
    # База нужна самой сборке: каталог читается из Prisma (задача 2.1), а
    # `generateStaticParams` берёт слаги оттуда же. До этого `DATABASE_URL` был
    # заглушкой, и сборка проходила без базы вовсе — теперь такой прогон падает
    # на первой же статической странице занятия.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artdance
        ports:
          - 5432:5432
        # Без health-check сборка стартует раньше, чем база примет соединение.
        options: >-
          --health-cmd "pg_isready -U postgres -d artdance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate
      # Схема и данные: без сида каталог пуст, и сборка соберёт нулевые страницы,
      # а бюджет веса и заголовки будут проверены не на том, что увидит человек.
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      # Бюджет по gzip: JS отдельно для начальной загрузки и ленивых чанков,
      # плюс вес изображений и шрифтов из public/.
      - name: Бюджет веса
        run: npm run perf:budget
      # Единственный способ проверить CSP, security-заголовки и CSRF: поднять
      # сборку и посмотреть фактические ответы.
      - name: Security-заголовки и CSRF на живом сервере
        run: npm run verify:headers
      - name: Артефакт сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: .next/trace
          retention-days: 3

  # Lighthouse CI (2.10/8.3): a11y и SEO — блокирующие пороги, performance —
  # только предупреждение (шумные на CI-раннере, см. комментарий lighthouserc.json).
  # Отчёты остаются приватными: без публичного upload (решение по публикации —
  # за владельцем), только артефакт при падении. На пуше в main джоб обязателен,
  # на PR — предостерегающий, чтобы не заслонять другие проверки при первом прогоне.
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [consistency]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artdance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artdance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      # LHCI: collect и assert локально, отчёты — в lighthouse-ci-reports/ (upload.target=filesystem
      # в lighthouserc.json), в сеть не уходят. Пороги, URL и server command — из конфига.
      - name: Lighthouse-сборка и пороги
        run: npx @lhci/cli autorun --config=lighthouserc.json
      - name: Артефакт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lighthouse-ci-reports/
            .lighthouse-ci/
          retention-days: 5

  # Поведение в настоящем браузере: ловушка фокуса, Esc, порядок слоёв,
  # раскладка на трёх ширинах. Unit-тесты на эти свойства ответить не могут,
  # а проверять их глазами на каждом изменении — значит однажды не проверить.
  #
  # Набор (1215 тестов по трём профилям) разбит на четыре параллельных задания
  # по --shard, около 300 тестов в каждом. Один джоб гонял весь набор 34 минуты
  # на двух рабочих процессах, и ожидание слияния превышало полчаса. Каждый шард поднимает собственную базу, сидит её и
  # собирает проект, поэтому шарды не делят состояние и не мешают друг другу.
  e2e:
    name: Поведение в браузере (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Шард собирает проект и прогоняет четверть набора: локально весь набор
    # занимает 13 минут при двух рабочих процессах, на раннере — дольше.
    timeout-minutes: 30
    needs: [consistency]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Та же база, что и у сборки: экраны каталога читают Prisma, а проверки
    # входа — таблицы сессий и попыток. Без сида страницы пусты, и падают не
    # проверки поведения, а отсутствие данных.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artdance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artdance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # Только chromium: все три профиля в playwright.config.ts на нём и работают.
      - run: npx playwright install --with-deps chromium
      # Проверки идут против production-сборки: у dev-сервера другой CSS-конвейер.
      - run: npm run build
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
